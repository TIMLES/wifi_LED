[env:musici_wifi]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
build_src_filter = +<musici_wifi.cpp>

[env:musici_serial]
    platform = espressif32
    board = seeed_xiao_esp32s3
    framework = arduino
    lib_deps =adafruit/Adafruit NeoPixel @ ^1.12.0
    build_src_filter = +<musici_serial.cpp>


[env:Xbox_udp]
    platform = espressif32
    board = dfrobot_beetle_esp32c3
    framework = arduino
    lib_deps  = U8g2
    build_src_filter = +<Xbox_udp.cpp>
